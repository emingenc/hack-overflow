<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040806"/>
      <stop offset="45%" stop-color="#090e0c"/>
      <stop offset="75%" stop-color="#0d1511"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7dffa8"/>
      <stop offset="60%" stop-color="#3dff8c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3dff8c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#3dff8c" opacity="0.5">
    <circle cx="90" cy="40" r="1.2"/><circle cx="240" cy="80" r="0.8"/><circle cx="400" cy="30" r="1"/>
    <circle cx="560" cy="60" r="0.9"/><circle cx="730" cy="25" r="1.3"/><circle cx="900" cy="70" r="0.7"/>
    <circle cx="1050" cy="45" r="1.1"/><circle cx="1180" cy="90" r="0.8"/><circle cx="150" cy="120" r="0.7"/>
    <circle cx="680" cy="110" r="0.9"/><circle cx="980" cy="130" r="0.6"/>
  </g>

  <!-- Moon -->
  <circle cx="1060" cy="70" r="34" fill="url(#moon)"/>

  <!-- Far layer: distant towers (dark, low detail) -->
  <g fill="#080d0a">
    <rect x="20" y="200" width="60" height="160"/>
    <rect x="90" y="230" width="45" height="130"/>
    <rect x="150" y="190" width="70" height="170"/>
    <rect x="240" y="215" width="55" height="145"/>
    <rect x="310" y="175" width="80" height="185"/>
    <rect x="410" y="225" width="50" height="135"/>
    <rect x="480" y="195" width="65" height="165"/>
    <rect x="560" y="235" width="45" height="125"/>
    <rect x="620" y="180" width="75" height="180"/>
    <rect x="715" y="220" width="55" height="140"/>
    <rect x="790" y="190" width="70" height="170"/>
    <rect x="880" y="235" width="48" height="125"/>
    <rect x="945" y="200" width="65" height="160"/>
    <rect x="1030" y="225" width="55" height="135"/>
    <rect x="1105" y="185" width="72" height="175"/>
    <rect x="1195" y="215" width="55" height="145"/>
  </g>

  <!-- Windows on far layer -->
  <g fill="#12301c" opacity="0.8">
    <rect x="30" y="215" width="4" height="4"/><rect x="42" y="235" width="4" height="4"/><rect x="55" y="250" width="4" height="4"/>
    <rect x="160" y="205" width="4" height="4"/><rect x="175" y="230" width="4" height="4"/><rect x="190" y="260" width="4" height="4"/>
    <rect x="320" y="190" width="4" height="4"/><rect x="340" y="215" width="4" height="4"/><rect x="360" y="240" width="4" height="4"/>
    <rect x="490" y="210" width="4" height="4"/><rect x="510" y="235" width="4" height="4"/>
    <rect x="630" y="195" width="4" height="4"/><rect x="650" y="225" width="4" height="4"/><rect x="670" y="255" width="4" height="4"/>
    <rect x="800" y="205" width="4" height="4"/><rect x="820" y="235" width="4" height="4"/>
    <rect x="955" y="215" width="4" height="4"/><rect x="975" y="245" width="4" height="4"/>
    <rect x="1115" y="200" width="4" height="4"/><rect x="1140" y="230" width="4" height="4"/>
  </g>

  <!-- Mid layer: mid towers with more detail + cyan window grids -->
  <g fill="#050a08">
    <rect x="60" y="160" width="80" height="200"/>
    <rect x="180" y="140" width="90" height="220"/>
    <rect x="300" y="170" width="70" height="190"/>
    <rect x="430" y="150" width="85" height="210"/>
    <rect x="555" y="165" width="75" height="195"/>
    <rect x="670" y="145" width="95" height="215"/>
    <rect x="800" y="170" width="70" height="190"/>
    <rect x="920" y="155" width="85" height="205"/>
    <rect x="1050" y="165" width="80" height="195"/>
    <rect x="1170" y="150" width="75" height="210"/>
  </g>

  <!-- Cyan windows on mid layer -->
  <g fill="#00ff41" opacity="0.75">
    <rect x="70" y="175" width="8" height="6"/><rect x="90" y="190" width="8" height="6"/><rect x="110" y="210" width="8" height="6"/><rect x="80" y="230" width="8" height="6"/><rect x="105" y="255" width="8" height="6"/>
    <rect x="190" y="155" width="10" height="6"/><rect x="215" y="175" width="10" height="6"/><rect x="240" y="200" width="10" height="6"/><rect x="195" y="225" width="10" height="6"/><rect x="225" y="250" width="10" height="6"/>
    <rect x="310" y="185" width="8" height="6"/><rect x="335" y="210" width="8" height="6"/><rect x="355" y="240" width="8" height="6"/>
    <rect x="440" y="165" width="10" height="6"/><rect x="465" y="190" width="10" height="6"/><rect x="490" y="215" width="10" height="6"/><rect x="445" y="240" width="10" height="6"/>
    <rect x="565" y="180" width="8" height="6"/><rect x="590" y="205" width="8" height="6"/><rect x="615" y="235" width="8" height="6"/>
    <rect x="680" y="160" width="10" height="6"/><rect x="710" y="185" width="10" height="6"/><rect x="735" y="210" width="10" height="6"/><rect x="690" y="240" width="10" height="6"/><rect x="720" y="265" width="10" height="6"/>
    <rect x="810" y="185" width="8" height="6"/><rect x="835" y="215" width="8" height="6"/><rect x="855" y="245" width="8" height="6"/>
    <rect x="930" y="170" width="10" height="6"/><rect x="955" y="195" width="10" height="6"/><rect x="980" y="225" width="10" height="6"/><rect x="940" y="250" width="10" height="6"/>
    <rect x="1060" y="180" width="8" height="6"/><rect x="1085" y="210" width="8" height="6"/><rect x="1110" y="240" width="8" height="6"/>
    <rect x="1180" y="165" width="10" height="6"/><rect x="1205" y="195" width="10" height="6"/><rect x="1225" y="225" width="10" height="6"/>
  </g>

  <!-- Magenta accent windows (rare, glowing) -->
  <g fill="#00ff41" opacity="0.9" filter="url(#glow)">
    <rect x="225" y="180" width="6" height="6"/>
    <rect x="480" y="170" width="6" height="6"/>
    <rect x="720" y="165" width="6" height="6"/>
    <rect x="970" y="175" width="6" height="6"/>
    <rect x="1210" y="200" width="6" height="6"/>
  </g>

  <!-- Antennas -->
  <g stroke="#0b140c" stroke-width="2">
    <line x1="225" y1="140" x2="225" y2="100"/>
    <line x1="225" y1="100" x2="233" y2="92"/>
    <line x1="472" y1="150" x2="472" y2="112"/>
    <line x1="472" y1="112" x2="466" y2="104"/>
    <line x1="717" y1="145" x2="717" y2="108"/>
    <circle cx="717" cy="105" r="3" fill="#00ff41" filter="url(#glow)"/>
    <line x1="1212" y1="150" x2="1212" y2="110"/>
    <circle cx="1212" cy="107" r="3" fill="#00ff41" filter="url(#glow)"/>
  </g>

  <!-- Holographic billboards -->
  <g filter="url(#glow)">
    <rect x="185" y="300" width="90" height="26" fill="#0b1511" stroke="#00ff41" stroke-width="1.5" opacity="0.95"/>
    <rect x="192" y="307" width="24" height="12" fill="#00ff41" opacity="0.9"/>
    <text x="222" y="316" font-family="monospace" font-size="11" fill="#00ff41">SYS</text>
    <rect x="440" y="310" width="70" height="22" fill="#080d0a" stroke="#00ff41" stroke-width="1.5" opacity="0.95"/>
    <text x="450" y="325" font-family="monospace" font-size="10" fill="#3dff8c">NET</text>
    <rect x="940" y="295" width="95" height="26" fill="#0b1511" stroke="#3dff8c" stroke-width="1.5" opacity="0.95"/>
    <text x="948" y="313" font-family="monospace" font-size="11" fill="#3dff8c">HACK://</text>
  </g>

  <!-- Foreground silhouette: rooftops + pipes (very dark) -->
  <g fill="#030605">
    <path d="M0 360 L0 320 L40 320 L40 300 L120 300 L120 325 L180 325 L180 310 L260 310 L260 330 L320 330 L320 300 L400 300 L400 322 L470 322 L470 315 L550 315 L550 335 L640 335 L640 305 L720 305 L720 325 L800 325 L800 312 L880 312 L880 330 L950 330 L950 305 L1040 305 L1040 322 L1120 322 L1120 312 L1200 312 L1200 328 L1280 328 L1280 360 Z"/>
    <rect x="60" y="280" width="12" height="40" fill="#050a08"/>
    <rect x="330" y="270" width="14" height="30" fill="#050a08"/>
    <rect x="660" y="275" width="10" height="30" fill="#050a08"/>
    <rect x="1050" y="272" width="12" height="33" fill="#050a08"/>
  </g>

  <!-- Haze overlay -->
  <rect width="1280" height="360" fill="url(#haze)"/>
</svg>
